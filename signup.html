<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — LUXEMART</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root{--black:#07070a;--charcoal:#111114;--off-white:#f5f2eb;--gold:#c9a84c;--gold-bright:#e4c76b;--text-dim:#a09b90;--line:rgba(201,168,76,0.2);--surface:rgba(17,17,20,0.85);--border:rgba(255,255,255,0.07);--radius:14px;--ff:system-ui,-apple-system,Segoe UI,Roboto,Arial;--shadow:0 24px 70px -18px rgba(0,0,0,0.7);--trans:.35s cubic-bezier(.2,.8,.2,1)}
    body{margin:0;font-family:var(--ff);background:var(--black);color:var(--off-white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px}
    .card{width:min(560px,100%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .head{padding:24px 24px 18px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;justify-content:space-between}
    .logo{display:flex;gap:10px;align-items:center}
    .seal{width:10px;height:10px;background:var(--gold);border-radius:50%;box-shadow:0 0 18px rgba(201,168,76,.8)}
    .logo b{font-size:20px;letter-spacing:.03em;font-weight:600}
    .logo em{color:var(--gold);font-style:italic;font-weight:400}
    .body{padding:22px 24px 24px}
    h1{margin:0 0 6px;font-size:22px;font-weight:700}
    p{margin:0 0 18px;color:var(--text-dim);line-height:1.6;font-size:14px}
    form{display:grid;gap:12px}
    label{font-size:13px;color:var(--text-dim);letter-spacing:.02em}
    input{width:100%;padding:13px 14px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--off-white);outline:none;transition:border-color var(--trans),background var(--trans)}
    input:focus{border-color:rgba(201,168,76,0.6);background:rgba(255,255,255,0.06)}
    .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .btn{padding:12px 16px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:transform var(--trans),background var(--trans),border-color var(--trans);font-weight:700;letter-spacing:.02em}
    .btn-primary{background:var(--gold);color:#0a0805;border-color:var(--gold)}
    .btn-primary:hover{background:var(--gold-bright);transform:translateY(-2px)}
    .btn-ghost{background:transparent;color:var(--off-white);border-color:var(--border)}
    .btn-ghost:hover{border-color:rgba(201,168,76,0.6);transform:translateY(-2px)}
    .msg{margin-top:10px;min-height:18px;color:var(--gold-bright);font-size:13px}
    .links{margin-top:14px;font-size:14px;color:var(--text-dim);display:flex;gap:10px;flex-wrap:wrap}
    .links a{color:var(--gold-bright);text-decoration:none;font-weight:700}
    .footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-dim)}
  </style>
</head>
<body>
  <div class="card" role="main" aria-label="Create account">
    <div class="head">
      <div class="logo"><span class="seal"></span><b>LUXE<em>MART</em></b></div>
      <a href="test.html" style="color:var(--text-dim);text-decoration:none;font-weight:700"><i class="fa-solid fa-arrow-left" style="margin-right:8px"></i>Back</a>
    </div>

    <div class="body">
      <h1>Create Account</h1>
      <p>Demo signup stores your account in <strong>localStorage</strong> so you can sign in and buy.</p>

      <form id="signupForm" novalidate>
        <div>
          <label for="name">Full Name</label>
          <input id="name" type="text" required placeholder="Your name" autocomplete="name" />
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="you@example.com" autocomplete="email" />
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" type="password" required placeholder="Choose password" autocomplete="new-password" />
        </div>

        <div class="row">
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none">
            <input id="agree" type="checkbox" style="width:16px;height:16px" /> I agree to demo Terms
          </label>
          <button class="btn btn-ghost" type="button" id="demoFill" title="Fill demo data">Fill Demo</button>
        </div>

        <button class="btn btn-primary" type="submit"><i class="fa-solid fa-user-plus" style="margin-right:10px"></i>Create Account</button>
        <div class="msg" id="msg" aria-live="polite"></div>

        <div class="links">
          <span>Already have an account?</span>
          <a href="login.html">Sign In</a>
        </div>
      </form>
    </div>

    <div class="footer">
      <span><i class="fa-solid fa-shield-halved" style="margin-right:8px"></i>Secure demo registration</span>
      <span><i class="fa-solid fa-lock" style="margin-right:8px"></i>No real network calls</span>
    </div>
  </div>

  <script>
    const $ = (id)=>document.getElementById(id);
    const msgEl = $('msg');
    const setMsg = (t,isErr=false)=>{
      msgEl.style.color = isErr ? '#ff6b6b' : 'var(--gold-bright)';
      msgEl.textContent = t;
    };

    $('demoFill').addEventListener('click',()=>{
      $('name').value = 'Demo User';
      $('email').value = 'demo@example.com';
      $('password').value = 'demo12345';
      $('agree').checked = true;
      setMsg('Demo data filled. Submit to create account.');
    });

    function getUsers(){
      try{ return JSON.parse(localStorage.getItem('lx-users') || '[]'); }catch{ return []; }
    }
    function setUsers(users){
      localStorage.setItem('lx-users', JSON.stringify(users));
    }

    $('signupForm').addEventListener('submit',(e)=>{
      e.preventDefault();
      setMsg('');

      const name = $('name').value.trim();
      const email = $('email').value.trim().toLowerCase();
      const password = $('password').value;
      const agree = $('agree').checked;

      if(!name || !email || !password){ setMsg('Please fill all fields.', true); return; }
      if(!agree){ setMsg('Please agree to the demo Terms.', true); return; }

      const users = getUsers();
      const exists = users.some(u => u.email.toLowerCase() === email);
      if(exists){ setMsg('Account already exists for this email. Please sign in.', true); return; }

      const user = {
        id: 'u_' + Math.random().toString(36).slice(2,10),
        name,
        email,
        password,
        createdAt: new Date().toISOString()
      };

      users.push(user);
      setUsers(users);

      // Auto-login after signup
      localStorage.setItem('lx-user', JSON.stringify({ id:user.id, name:user.name, email:user.email, createdAt:user.createdAt }));

      setMsg('Account created successfully. Redirecting…');
      setTimeout(()=>{
        window.location.href='test.html';
      }, 800);
    });

    // If already signed in, redirect
    (function(){
      const user = localStorage.getItem('lx-user');
      if(user){ setTimeout(()=>window.location.href='test.html', 300); }
    })();
  </script>
</body>
</html>
